name: Unzip project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and copy
        run: |
          unzip -q PaymentBridge_v2.zip -d _tmp
          rsync -a --exclude '.github' _tmp/payment-bridge-main/ ./
          rm -rf _tmp PaymentBridge_v2.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Payment Bridge v2" || echo "nothing to commit"
          git push
