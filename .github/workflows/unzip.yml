name: Unzip project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and copy
        run: |
          ZIP=$(ls *.zip | head -n1)
          mkdir _tmp
          unzip -q "$ZIP" -d _tmp
          SRC=_tmp
          if [ "$(ls -A _tmp | wc -l)" -eq 1 ] && [ -d "_tmp/$(ls _tmp)" ]; then
            SRC="_tmp/$(ls _tmp)"
          fi
          rsync -a --exclude '.github' "$SRC"/ ./
          rm -rf _tmp "$ZIP"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update Payment Bridge v4" || echo "nothing to commit"
          git push
